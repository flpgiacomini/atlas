name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: current/atlas-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: current/atlas-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: python scripts/validate_dist.py
      - run: python scripts/validate_links.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: current/atlas-web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
