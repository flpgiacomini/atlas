name: Atlas CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v2-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: current/atlas-v2-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: current/atlas-v2-app/package-lock.json
      - run: npm ci
      - run: npm run verify
  v2-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: current/atlas-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/validate_contracts.py
      - run: python scripts/validate_brand_timeline.py
      - run: python scripts/validate_brand_relations.py
      - run: python scripts/validate_annual_chapters.py
      - run: python scripts/audit_editorial_coverage.py --check
      - run: python scripts/audit_journey_coverage.py --check
      - run: python scripts/audit_story_media.py --check
      - run: python scripts/audit_spatial_inventory.py --check
      - run: python scripts/audit_canonical_curation.py --check
      - run: python scripts/audit_c18_semantics.py --check
      - run: python scripts/audit_source_independence.py --check
      - run: python scripts/audit_catalog_promotion.py --check
      - run: python scripts/audit_vehicle_temporal_anchor.py --check
      - run: python scripts/migrate_sqlite.py
      - run: python scripts/validate_migration.py
      - name: Assert deterministic migration
        run: python scripts/check_determinism.py
      - run: python scripts/build_bundles.py
      - run: python scripts/validate_bundles.py
      - name: Assert deterministic bundles
        run: python scripts/check_bundles_determinism.py
  verify:
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: current/atlas-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: current/atlas-web/package-lock.json
      - run: npm ci
      - run: python ../canonical-model/scripts/validate_atlas_db.py data/atlas.sqlite
      - run: npm run verify
      - run: python scripts/validate_links.py
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-dist
          path: current/atlas-web/dist
          if-no-files-found: error
